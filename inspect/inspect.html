<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuyuha Link Inspector & Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 space-y-6 mt-6">
        <div class="text-center space-y-1">
            <span class="bg-sky-500/10 text-sky-400 text-xs font-semibold px-3 py-1 rounded-full border border-sky-500/20">FUYUHA TOOLS</span>
            <h1 class="text-xl font-bold tracking-tight mt-2">Link Inspector & Secret Extractor</h1>
            <p class="text-xs text-slate-400">Bedah URL, tangkap token, API keys, dan endpoint rahasia</p>
        </div>

        <!-- Bagian Input URL -->
        <div class="space-y-3 bg-slate-950/50 border border-slate-800/80 p-4 rounded-xl">
            <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Target URL / Magic Link</label>
            <input type="url" id="targetUrl" placeholder="https://target-website.com atau link auth..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:border-sky-500 text-slate-200">
            <button id="inspectBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2 rounded-lg text-sm transition-all shadow-lg shadow-sky-900/20">
                Inspeksi & Ekstrak Data
            </button>
        </div>

        <!-- Output Log & Hasil Ekstraksi -->
        <div class="space-y-2">
            <div class="flex justify-between items-center text-[10px] text-slate-400 px-1">
                <span>inspector_result.json</span>
                <button id="copyJsonBtn" class="hover:text-sky-400 transition-colors font-medium">Salin JSON Mentah</button>
            </div>
            <div id="resultOutput" class="bg-black/80 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-300 min-h-[160px] max-h-96 overflow-y-auto whitespace-pre-wrap select-all">
                [SYSTEM] Siap memindai... Masukkan URL di atas.
            </div>
        </div>
    </div>

    <script src="inspect-tools.js"></script>
</body>
</html>
