<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fuyuha Arshi - Tools</title>
  <meta name="description" content="Kumpulan tools web dari Fuyuha Arshi." />
  <style>
    :root {
      --bg: #0a0b0f;
      --panel: rgba(23, 26, 33, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef0f5;
      --muted: #9aa1ae;
      --accent: #7c5cff;
      --accent2: #3ad1c4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 10% -10%, #1b1640 0%, transparent 60%),
                  radial-gradient(900px 500px at 110% 110%, #0f3a3a 0%, transparent 60%),
                  var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---------- Background video ---------- */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.35;
      filter: saturate(1.1);
    }
    .bg-shade {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(10,11,15,0.2) 0%, rgba(10,11,15,0.85) 100%);
      pointer-events: none;
    }

    /* ---------- Header ---------- */
    header {
      padding: 56px 20px 12px;
      text-align: center;
      animation: fadeDown 0.8s ease both;
    }
    header h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, var(--accent), var(--accent2), #fff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    /* ---------- Cards ---------- */
    main {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      flex: 1;
    }
    a.card {
      position: relative;
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      color: var(--text);
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    a.card:nth-child(1) { animation-delay: 0.15s; }
    a.card:nth-child(2) { animation-delay: 0.3s; }
    a.card:nth-child(3) { animation-delay: 0.45s; }
    a.card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 16px;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%), rgba(124,92,255,0.22), transparent 40%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    a.card:hover {
      transform: translateY(-4px);
      border-color: rgba(124,92,255,0.6);
      box-shadow: 0 12px 36px rgba(124,92,255,0.25);
    }
    a.card:hover::before { opacity: 1; }
    a.card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    a.card h2::after {
      content: "→";
      margin-left: auto;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    a.card:hover h2::after { opacity: 1; transform: translateX(0); }
    a.card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0 0 30px;
      animation: fadeIn 1s ease 0.6s both;
    }

    /* ---------- Splash ---------- */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }
    #splash.out { opacity: 0; pointer-events: none; }
    #splashVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #skipSplash {
      position: absolute;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.4);
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    /* ---------- Keyframes ---------- */
    @keyframes shine { to { background-position: 300% 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- Reduced motion ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      #bgVideo { display: none; }
    }
  </style>
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline preload="auto" aria-hidden="true">
  <source src="assets/bg.mp4" type="video/mp4" />
</video>
<div class="bg-shade" aria-hidden="true"></div>

<div id="splash">
  <video id="splashVideo" muted playsinline preload="auto">
    <source src="assets/splash.mp4" type="video/mp4" />
  </video>
  <button id="skipSplash" type="button">Lewati</button>
</div>

<header>
  <h1>Fuyuha Arshi</h1>
  <p>Pilih tools di bawah ini.</p>
</header>

<main>
  <a class="card" href="image-vectorizer/image2svg.html">
    <h2>Image to SVG</h2>
    <p>Ubah gambar PNG, JPG, atau WEBP menjadi SVG vektor langsung di browser.</p>
  </a>

  <a class="card" href="svg2am/svg2am.html">
    <h2>SVG to Alight Motion</h2>
    <p>Ubah SVG menjadi file XML scene Alight Motion yang bisa diimpor.</p>
  </a>

  <a class="card" href="amprem/verifier.html">
    <h2>Verifier</h2>
    <p>Tools amprem: verifier.</p>
  </a>
</main>

<footer>Fuyuha Arshi</footer>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bg = document.getElementById('bgVideo');
  var splash = document.getElementById('splash');
  var splashVideo = document.getElementById('splashVideo');
  var skip = document.getElementById('skipSplash');

  // Video latar: kalau gagal dimuat, latar gradien tetap tampil
  if (bg) {
    if (reduce) {
      bg.remove();
    } else {
      bg.addEventListener('error', function () { bg.remove(); }, true);
      var p = bg.play(); if (p && p.catch) p.catch(function () { bg.remove(); });
    }
  }

  // Splash: tampil sekali per sesi browser
  if (!splash) return;
  var seen = false;
  try { seen = sessionStorage.getItem('splashSeen') === '1'; } catch (e) {}
  if (seen || reduce) { splash.remove(); return; }

  var closed = false;
  function closeSplash() {
    if (closed) return;
    closed = true;
    try { sessionStorage.setItem('splashSeen', '1'); } catch (e) {}
    splash.classList.add('out');
    setTimeout(function () { splash.remove(); }, 800);
  }

  splashVideo.addEventListener('ended', closeSplash);
  splashVideo.addEventListener('error', closeSplash);
  skip.addEventListener('click', closeSplash);
  setTimeout(closeSplash, 8000); // batas aman kalau video macet

  var sp = splashVideo.play();
  if (sp && sp.catch) sp.catch(closeSplash);

  // Efek sorot mengikuti kursor di kartu
  document.querySelectorAll('a.card').forEach(function (card) {
    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
})();
</script>

<script src="/maintenance.js"></script>
</body>
</html>
