<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuyuha ImageTracer - Ubah Gambar ke SVG</title>
  <meta name="description" content="Ubah gambar PNG/JPG menjadi SVG vektor langsung di browser." />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #8a909c;
      --accent: #7c5cff;
      --accent-hover: #6a49f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 24px 20px 8px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px 40px;
      display: grid;
      gap: 20px;
      grid-template-columns: 300px 1fr;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    select, input[type="range"] { width: 100%; }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.95rem;
    }
    .range-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
    .range-row strong { color: var(--text); }
    .file-input {
      width: 100%;
      padding: 14px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .file-input:hover { border-color: var(--accent); color: var(--text); }
    input[type="file"] { display: none; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    button.secondary:hover:not(:disabled) { background: var(--bg); }
    .preview-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 600px) {
      .preview-grid { grid-template-columns: 1fr; }
    }
    .preview-box {
      background: #fff;
      border-radius: 10px;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .preview-box img, .preview-box svg {
      max-width: 100%;
      max-height: 480px;
      display: block;
    }
    .caption {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
    }
    .placeholder { color: #999; font-size: 0.9rem; padding: 20px; text-align: center; }
    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status.error { color: #ff6b6b; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding-bottom: 30px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>

<header>
  <h1>Fuyuha ImageTracer</h1>
  <p>Ubah gambar PNG atau JPG menjadi SVG vektor, langsung di browser.</p>
</header>

<main>
  <section class="panel">
    <label for="fileInput">Gambar</label>
    <div class="file-input" id="dropZone">Klik untuk pilih gambar<br /><small>PNG, JPG, atau WEBP</small></div>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" />

    <label for="presetSelect">Preset</label>
    <select id="presetSelect">
      <option value="default">default</option>
      <option value="posterized1">posterized1</option>
      <option value="posterized2">posterized2</option>
      <option value="posterized3">posterized3</option>
      <option value="curvy">curvy</option>
      <option value="sharp">sharp</option>
      <option value="detailed">detailed</option>
      <option value="smoothed">smoothed</option>
      <option value="grayscale">grayscale</option>
      <option value="fixedpalette">fixedpalette</option>
      <option value="randomsampling1">randomsampling1</option>
      <option value="randomsampling2">randomsampling2</option>
      <option value="artistic1">artistic1</option>
      <option value="artistic2">artistic2</option>
      <option value="artistic3">artistic3</option>
      <option value="artistic4">artistic4</option>
    </select>

    <label for="colorsRange">Jumlah warna</label>
    <div class="range-row"><span>Warna</span><strong id="colorsValue">16</strong></div>
    <input type="range" id="colorsRange" min="2" max="64" step="1" value="16" />

    <label for="sizeSelect">Ukuran maksimum proses</label>
    <select id="sizeSelect">
      <option value="400">400 px (cepat)</option>
      <option value="800" selected>800 px (seimbang)</option>
      <option value="1200">1200 px (detail, lebih lambat)</option>
    </select>

    <button id="traceBtn" disabled>Ubah ke SVG</button>
    <button id="downloadBtn" class="secondary" disabled>Unduh SVG</button>

    <div class="status" id="status"></div>
  </section>

  <section class="panel">
    <div class="preview-grid">
      <div>
        <div class="preview-box" id="originalBox">
          <div class="placeholder">Gambar asli akan tampil di sini</div>
        </div>
        <div class="caption">Asli</div>
      </div>
      <div>
        <div class="preview-box" id="resultBox">
          <div class="placeholder">Hasil SVG akan tampil di sini</div>
        </div>
        <div class="caption" id="resultCaption">Hasil</div>
      </div>
    </div>
  </section>
</main>

<footer>
  Berbasis <a href="https://github.com/jankovicsandras/imagetracerjs" target="_blank" rel="noopener">imagetracerjs</a> (Unlicense)
</footer>

<script src="imagetracer.js"></script>
<script src="image2svg.js"></script>
<script src="/maintenance.js"></script>
</body>
</html>
